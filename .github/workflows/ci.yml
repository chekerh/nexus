name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
      - name: Run ruff linter
        run: ruff check backend/ tests/
      - name: Run ruff formatter check
        run: ruff format --check backend/ tests/
      - name: Security lint (bandit, blocking on Medium+)
        run: bandit -r backend/ -c pyproject.toml -ll

  typecheck:
    name: Typecheck (mypy) + import/bytecode smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy
      - name: Run mypy
        run: mypy backend/
      - name: Bytecode compile check
        run: python -m compileall -q backend/
      - name: App import smoke
        run: python -c "from backend.app.main import app"
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENCRYPTION_KEY: test-encryption-key-not-for-prod
          JWT_SECRET: test-jwt-secret-for-ci
          DATABASE_URL: sqlite:///tmp/test-nexus.db

  test:
    name: Test (pytest) + vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Dependency vulnerability scan (blocking)
        run: |
          pip install pip-audit
          # PYSEC-2026-2132 (click.edit): gTTS==2.5.4 pins click<8.2; fix is 8.3.3.
          # click.edit() is an interactive editor helper unused by the app or
          # gTTS's library path. Everything else stays blocking.
          pip-audit --desc on -r requirements.txt --ignore-vuln PYSEC-2026-2132
      - name: Run tests with coverage floor
        run: python -m pytest tests/ -q --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=30
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENCRYPTION_KEY: test-encryption-key-not-for-prod
          JWT_SECRET: test-jwt-secret-for-ci
          DATABASE_URL: sqlite:///tmp/test-nexus.db

  frontend:
    name: Frontend (JS syntax + API reference integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: JS syntax check
        run: |
          set -e
          for f in frontend/*.js; do
            node --check "$f"
            echo "OK $f"
          done
      - name: API reference integrity check
        run: python scripts/check_api_refs.py
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENCRYPTION_KEY: test-encryption-key-not-for-prod
          JWT_SECRET: test-jwt-secret-for-ci
          DATABASE_URL: sqlite:///tmp/test-nexus.db

  smoke:
    name: Smoke (deployment checks)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run deployment smoke tests
        run: python -m pytest tests/test_deployment_smoke.py tests/test_security_headers.py -v --tb=short
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ENCRYPTION_KEY: test-encryption-key-not-for-prod
          JWT_SECRET: test-jwt-secret-for-ci
          DATABASE_URL: sqlite:///tmp/test-nexus.db

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend, smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
