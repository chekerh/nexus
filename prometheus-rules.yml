groups:
  - name: nexus-ugc-alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(nexus_http_requests_total{status=~"5.."}[5m]) / rate(nexus_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate ({{ $value | humanizePercentage }})"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: QueueDepthSpike
        expr: nexus_queue_depth > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline queue depth is {{ $value }}"
          description: "Jobs are piling up. Worker may be stuck or overloaded."

      - alert: HighJobFailureRate
        expr: rate(nexus_pipeline_jobs_total{status="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline jobs are failing"
          description: "Jobs are failing in the pipeline. Check worker logs."

      - alert: NoActiveUsers
        expr: nexus_active_users == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No active users"
          description: "No active users detected in the last 30 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(nexus_http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency ({{ $value }}s)"
          description: "p95 request latency is above 5 seconds."

      - alert: CreditsExhausted
        expr: nexus_credits_consumed_total - nexus_credits_consumed_total offset 1d == 0
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "No credits consumed in 24h"
          description: "No pipeline credits consumed in the last 24 hours. Possible service degradation."

      - alert: DiskSpaceLow
        expr: (nexus_disk_free_bytes / nexus_disk_total_bytes) < 0.2
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space ({{ $value | humanizePercentage }})"
          description: "Less than 20% disk space remaining."
