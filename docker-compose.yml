version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///backend/data/nexus.db}
    volumes:
      - ./backend/data:/app/backend/data
      - ./frontend:/app/frontend
      - ./prompts:/app/prompts
    restart: unless-stopped

  # Uncomment for PostgreSQL in production:
