services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./frontend:/srv/frontend
      - ./logs/caddy:/var/log/caddy
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  app:
    build: .
    init: true
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://nexus:${POSTGRES_PASSWORD}@db:5432/nexus}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - RATE_LIMIT_BACKEND=database
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nexus_data:/app/backend/data
      - ./frontend:/app/frontend
      - ./prompts:/app/prompts
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "8", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

networks:
  default:
    name: nexus-ugc
    driver: bridge

volumes:
  pgdata:
  nexus_data:
  caddy_data:
  caddy_config:
