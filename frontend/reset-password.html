<!DOCTYPE html>
<html lang="en" data-i18n>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>N</text></svg>">
  <meta name="description" content="Reset your Nexus-UGC account password. Choose a strong password to secure your account.">
  <meta property="og:title" content="Reset Password — Nexus-UGC">
  <meta property="og:description" content="Reset your Nexus-UGC account password. Choose a strong password to secure your account.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>Reset Password — Nexus-UGC</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0a0e17">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
</head>
<body>
  <a href="#main-content" class="skip-to-content" data-i18n="common.skip-to-content">Skip to content</a>
  <noscript><div style="position:fixed;inset:0;z-index:9999;background:#05080f;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center"><h1 style="color:#fff;font-size:1.5rem;margin:0">JavaScript Required</h1><p>Nexus-UGC requires JavaScript. Please enable it in your browser settings.</p></div></noscript>
  <canvas id="particle-canvas"></canvas>
  <nav class="navbar">
    <div class="navbar-brand">
      <div class="brand-icon">N</div>
      <a href="index.html"><span>Nexus<span class="gradient-text">UGC</span></span></a>
    </div>
    <div class="navbar-actions">
      <span class="user-email" id="user-email"></span>
      <button class="btn btn-ghost btn-sm" id="login-btn">Sign In</button>
    </div>
  </nav>
  <main id="main-content"><div class="login-page">
    <div class="glass-card login-card" style="max-width:420px;">
      <h1 class="gradient-text">Reset Password</h1>
      <p class="login-subtitle" id="reset-subtitle">Enter your new password below.</p>

      <div id="reset-form-section">
        <form id="reset-form" novalidate>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="reset-pw" class="form-input" placeholder="At least 8 characters" required minlength="8">
            <div class="field-error hidden" id="reset-pw-error">Must be at least 8 characters</div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="reset-pw-confirm" class="form-input" placeholder="Repeat password" required>
            <div class="field-error hidden" id="reset-pw-confirm-error">Passwords do not match</div>
          </div>
          <button type="submit" class="btn btn-primary w-full" id="reset-btn">Reset Password</button>
        </form>
      </div>
      <div id="reset-success-section" style="display:none;">
        <p style="color:var(--green);margin-bottom:1rem;">✅ Password reset successfully!</p>
        <a href="login.html" class="btn btn-primary w-full" style="display:block;text-align:center;">Sign In</a>
      </div>
    </div>
  </div></main>
  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script defer src="ui.js"></script>
  <script >
    document.getElementById('reset-form').addEventListener('submit', async e => {
      e.preventDefault();
      const token = new URLSearchParams(window.location.search).get('token');
      if (!token) { document.getElementById('reset-pw-error').textContent = 'Missing reset token. Use the link from your email.'; document.getElementById('reset-pw-error').classList.remove('hidden'); return; }
      const pw = document.getElementById('reset-pw').value;
      const confirm = document.getElementById('reset-pw-confirm').value;
      if (pw !== confirm) { document.getElementById('reset-pw-confirm-error')?.classList.remove('hidden'); return; }
      if (pw.length < 8) { document.getElementById('reset-pw-error')?.classList.remove('hidden'); return; }
      const btn = document.getElementById('reset-btn');
      btn.disabled = true; btn.textContent = 'Resetting...';
      try {
        const res = await apiJSON('/auth/reset-password', { method: 'POST', body: { token, password: pw } });
        document.getElementById('reset-form-section').style.display = 'none';
        document.getElementById('reset-success-section').style.display = '';
        showToast(res.message || 'Password reset!', 'success');
      } catch (err) { document.getElementById('reset-pw-error').textContent = err.message; document.getElementById('reset-pw-error').classList.remove('hidden'); }
      finally { btn.disabled = false; btn.textContent = 'Reset Password'; }
    });
  </script>
</body>
</html>
