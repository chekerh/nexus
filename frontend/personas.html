    <main class="main-area" id="main-content" style="padding:2rem">
      <div class="section" style="padding-top:0">
        <div class="page-header">
          <div>
            <h1>Personas</h1>
            <p>Brand identities that speak with one voice across every platform</p>
          </div>
          <button id="create-persona-btn" class="btn btn-primary">+ New Persona</button>
        </div>

        <div id="personas-grid" class="features-grid">
          <div class="loading-pulse" style="grid-column:1/-1;padding:3rem;text-align:center;color:var(--text-dim)">Loading personas...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- ====== Persona Drawer (create/edit) ====== -->
  <div id="persona-drawer" class="drawer-overlay" style="display:none">
    <div class="drawer">
      <div class="drawer-header">
        <h3 id="drawer-title">Create Persona</h3>
        <button class="btn btn-sm btn-ghost drawer-close">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="form-group">
          <label>Name</label>
          <input id="pf-name" class="form-input" placeholder="e.g. TechTitan">
        </div>
        <div class="form-group">
          <label>Bio</label>
          <textarea id="pf-bio" class="form-input" rows="2" placeholder="Short bio for this persona"></textarea>
        </div>
        <div class="form-group">
          <label>Voice Description</label>
          <textarea id="pf-voice" class="form-input" rows="2" placeholder="e.g. Bold, data-driven, confident but approachable"></textarea>
        </div>
        <div class="form-group">
          <label>Target Audience</label>
          <input id="pf-audience" class="form-input" placeholder="e.g. SaaS founders, 25-40">
        </div>
        <div class="form-group">
          <label>Tone</label>
          <select id="pf-tone" class="form-input">
            <option value="professional">Professional</option>
            <option value="casual">Casual</option>
            <option value="humorous">Humorous</option>
            <option value="inspirational">Inspirational</option>
            <option value="educational">Educational</option>
            <option value="controversial">Controversial</option>
          </select>
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="pf-auto-approve">
            Auto-approve generated content (skip manual approval)
          </label>
        </div>
        <div class="form-group">
          <label>Content Pillars (one per line)</label>
          <textarea id="pf-pillars" class="form-input" rows="3" placeholder="AI tutorials&#10;Product reviews&#10;Industry trends"></textarea>
        </div>
      </div>
      <div class="drawer-footer">
        <button class="btn btn-ghost drawer-close">Cancel</button>
        <button id="save-persona-btn" class="btn btn-primary">Save Persona</button>
      </div>
      <input type="hidden" id="pf-id" value="">
    </div>
  </div>

  <!-- ====== Repurpose Drawer ====== -->
  <div id="repurpose-drawer" class="drawer-overlay" style="display:none">
    <div class="drawer">
      <div class="drawer-header">
        <h3 id="repurpose-drawer-title">Repurpose Content</h3>
        <button class="btn btn-sm btn-ghost drawer-close">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="form-group">
          <label>Paste Transcript</label>
          <textarea id="repurpose-transcript" class="form-input" rows="6" placeholder="Paste your video transcript here. AI will generate platform-specific posts for Twitter, LinkedIn, Instagram, and Facebook..."></textarea>
        </div>
        <button id="repurpose-generate-btn" class="btn btn-primary w-full">Generate</button>
        <div id="repurpose-results" style="display:none;margin-top:1rem"></div>
      </div>
    </div>
  </div>
