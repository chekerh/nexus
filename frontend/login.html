<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexus-UGC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">Nexus-UGC</div>
            <p class="auth-subtitle">AI-Powered UGC Production System</p>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login">Sign In</button>
                <button class="auth-tab" id="tab-register">Create Account</button>
            </div>
            <form id="auth-form" class="auth-form" onsubmit="return false;">
                <div id="login-fields">
                    <div class="form-field">
                        <label>Email</label>
                        <input id="auth-email" type="email" class="modern-input" placeholder="you@example.com" required>
                    </div>
                    <div class="form-field">
                        <label>Password</label>
                        <input id="auth-password" type="password" class="modern-input" placeholder="At least 8 characters" required>
                    </div>
                </div>
                <div id="register-fields" style="display:none">
                    <div class="form-field">
                        <label>Email</label>
                        <input id="reg-email" type="email" class="modern-input" placeholder="you@example.com" required>
                    </div>
                    <div class="form-field">
                        <label>Display Name</label>
                        <input id="reg-name" type="text" class="modern-input" placeholder="Your name (optional)">
                    </div>
                    <div class="form-field">
                        <label>Password</label>
                        <input id="reg-password" type="password" class="modern-input" placeholder="At least 8 characters" required>
                    </div>
                </div>
                <button id="auth-submit" class="btn btn-primary" style="width:100%;margin-top:1rem">Sign In</button>
                <div id="auth-error" class="auth-error hidden"></div>
            </form>
            <div id="skip-section">
                <p class="auth-or">or</p>
                <button class="btn btn-secondary" id="skip-auth-btn" style="width:100%">Continue Without Account</button>
                <p class="auth-hint">Limited to 5 free credits. Login to unlock more.</p>
            </div>
        </div>
    </div>
    <script src="api.js"></script>
    <script>
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const loginFields = document.getElementById('login-fields');
        const registerFields = document.getElementById('register-fields');
        const authSubmit = document.getElementById('auth-submit');
        const authError = document.getElementById('auth-error');
        const skipBtn = document.getElementById('skip-auth-btn');

        let isLogin = true;

        tabLogin.onclick = () => {
            isLogin = true;
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginFields.style.display = '';
            registerFields.style.display = 'none';
            authSubmit.textContent = 'Sign In';
        };

        tabRegister.onclick = () => {
            isLogin = false;
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            loginFields.style.display = 'none';
            registerFields.style.display = '';
            authSubmit.textContent = 'Create Account';
        };

        authSubmit.onclick = async () => {
            authError.classList.add('hidden');
            try {
                if (isLogin) {
                    const email = document.getElementById('auth-email').value;
                    const password = document.getElementById('auth-password').value;
                    if (!email || !password) throw new Error('Please fill in all fields');
                    await login(email, password);
                } else {
                    const email = document.getElementById('reg-email').value;
                    const password = document.getElementById('reg-password').value;
                    const name = document.getElementById('reg-name').value;
                    if (!email || !password) throw new Error('Please fill in all fields');
                    if (password.length < 8) throw new Error('Password must be at least 8 characters');
                    await register(email, password, name);
                }
                window.location.href = '/';
            } catch (err) {
                authError.textContent = err.message;
                authError.classList.remove('hidden');
            }
        };

        skipBtn.onclick = () => {
            window.location.href = '/';
        };

        // Enter key support
        document.getElementById('auth-form').onkeydown = (e) => {
            if (e.key === 'Enter') authSubmit.click();
        };
    </script>
</body>
</html>
