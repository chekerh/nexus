    <main class="main-area" id="main-content" style="padding:2rem">
      <div class="section" style="padding-top:0">
        <div class="page-header">
          <div>
            <h1>Campaigns</h1>
            <p>Group content, set target platforms, auto-publish on schedule</p>
          </div>
          <button id="create-campaign-btn" class="btn btn-primary">+ New Campaign</button>
        </div>

        <div id="campaigns-grid" class="features-grid">
          <div class="loading-pulse" style="grid-column:1/-1;padding:3rem;text-align:center;color:var(--text-dim)">Loading campaigns...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Campaign Modal -->
  <div id="campaign-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="campaign-modal-title">
    <div class="modal glass-card modal-wide">
      <div class="modal-header">
        <h3 id="campaign-modal-title">Create Campaign</h3>
        <button class="btn btn-sm btn-ghost modal-close" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Campaign Name</label>
          <input id="cf-name" class="form-input" placeholder="e.g. Summer Launch 2026">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="cf-description" class="form-input" rows="2" placeholder="What's this campaign about?"></textarea>
        </div>
        <div class="form-group">
          <label>Persona</label>
          <select id="cf-persona" class="form-input">
            <option value="">No persona</option>
          </select>
        </div>
        <div class="form-group">
          <label>Target Platforms</label>
          <div id="cf-platforms" style="display:flex;flex-wrap:wrap;gap:0.5rem">
            <label class="checkbox-label"><input type="checkbox" value="youtube" checked> YouTube</label>
            <label class="checkbox-label"><input type="checkbox" value="instagram" checked> Instagram</label>
            <label class="checkbox-label"><input type="checkbox" value="tiktok" checked> TikTok</label>
            <label class="checkbox-label"><input type="checkbox" value="twitter"> X/Twitter</label>
            <label class="checkbox-label"><input type="checkbox" value="linkedin"> LinkedIn</label>
            <label class="checkbox-label"><input type="checkbox" value="facebook"> Facebook</label>
          </div>
        </div>
        <div class="form-group">
          <label>Start Date</label>
          <input id="cf-start" type="date" class="form-input">
        </div>
        <div class="form-group">
          <label>End Date</label>
          <input id="cf-end" type="date" class="form-input">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">Cancel</button>
        <button id="save-campaign-btn" class="btn btn-primary">Save Campaign</button>
      </div>
      <input type="hidden" id="cf-id" value="">
    </div>
  </div>

  <!-- Campaign Detail Modal -->
  <div id="detail-modal" class="modal-overlay" style="display:none">
    <div class="modal glass-card modal-wide">
      <div class="modal-header">
        <h3 id="detail-title">Campaign</h3>
        <button class="btn btn-sm btn-ghost modal-close">✕</button>
      </div>
      <div class="modal-body" id="detail-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost modal-close">Close</button>
        <button id="detail-activate-btn" class="btn btn-primary hidden">Activate</button>
        <button id="detail-pause-btn" class="btn btn-ghost hidden">Pause</button>
      </div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <script src="api.js"></script>

  <script defer src="ui.js"></script>
  <script defer src="campaigns.js"></script>
  <script defer src="choko-knowledge.js"></script>
  <script defer src="choko.js"></script>
